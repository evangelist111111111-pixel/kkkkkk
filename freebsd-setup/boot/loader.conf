# /boot/loader.conf — adapted from Dieggho/FreeBSD_Backups
# ThinkPad T490 · Intel GPU + WiFi

# --- Intel DRM kernel module ---
i915kms_load="YES"

# --- Intel WiFi (T490 uses iwlwifi) ---
iwlwifi_load="YES"
if_iwlwifi_load="YES"
linuxkpi_wlan_load="YES"

# --- Enable VESA framebuffer (fallback) ---
vesa_load="YES"

# --- Boot verbosity (set to 0 for silent boot) ---
boot_verbose="0"

# --- Faster boot ---
autoboot_delay="2"

# --- Memory disk (tmpfs for /tmp) ---
tmpfs_load="YES"

# --- Sound (Intel HD Audio) ---
snd_hda_load="YES"
