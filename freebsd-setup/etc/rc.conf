# /etc/rc.conf — adapted from Dieggho/FreeBSD_Backups
# ThinkPad T490 · Intel GPU + WiFi · Hyprland + Development

# --- Hostname ---
hostname="freebsd"

# --- Networking ---
ifconfig_em0="DHCP"                 # wired (T490 uses em0 or igb0)
wlans_iwlwifi0="wlan0"             # Intel WiFi (T490 uses iwlwifi)
ifconfig_wlan0="WPA DHCP"
create_args_wlan0="country US"     # update to your country code

# --- Essential services ---
dbus_enable="YES"
seatd_enable="YES"
moused_nondefault_enable="NO"      # not needed under Wayland

# --- Intel DRM / GPU ---
kld_list="i915kms iwlwifi if_iwlwifi"

# --- Audio (sndio + PulseAudio) ---
sndiod_enable="YES"

# --- Power management (important for laptop) ---
powerd_enable="YES"
powerd_flags="-a hiadaptive -b adaptive"
performance_cx_lowest="Cmax"
economy_cx_lowest="Cmax"

# --- Thermal ---
thermald_enable="YES"

# --- NTP ---
ntpd_enable="YES"
ntpd_sync_on_start="YES"

# --- Crash dumps (disable for desktop) ---
dumpdev="NO"
