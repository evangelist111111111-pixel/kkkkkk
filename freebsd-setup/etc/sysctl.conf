# /etc/sysctl.conf — adapted from Dieggho/FreeBSD_Backups
# Desktop + development tuning

# --- Shared memory (needed for some Wayland compositors) ---
kern.ipc.shmmax=2147483648
kern.ipc.shmall=524288

# --- Security: hide other users' processes ---
security.bsd.see_other_uids=0
security.bsd.see_other_gids=0
security.bsd.unprivileged_read_msgbuf=0

# --- Network performance ---
net.inet.tcp.sendspace=65536
net.inet.tcp.recvspace=65536

# --- VM / memory ---
vm.swappiness=10

# --- Disable coredumps for desktop use ---
kern.coredump=0
